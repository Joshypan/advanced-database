<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bootstrap page</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body>
    This is the update template.
    <form action="/update/{{data['id']}}" method="post">
        <hr />
        <p>Name:<input name="name" value="{{data['name']}}" /></p>
        <p>Age:<input name="age" value="{{data['age']}}" /></p>
        <p>Type:<input name="type" value="{{data['type']}}" /></p>
        <p>Food:
            <select name="food_id">
                {% for food in foods %}
                <option value="{{ food['id'] }}" {% if food['id'] == data['food_id'] %}selected{% endif %}>
                    {{ food['name'] }}
                </option>
                {% endfor %}
            </select>
        </p>
        <p>Owner:
            <select name="owner_id">
                {% for owner in owners %}
                <option value="{{ owner['id'] }}" {% if owner['id'] == data['owner_id'] %}selected{% endif %}>
                    {{ owner['name'] }}
                </option>
                {% endfor %}
            </select>
        </p>
        <hr />
        <button type="submit">Update</button>
        <a href="/list">Cancel</a>
        <hr />
    </form>
</body>

</html>
