<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bootstrap page</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body style="background-color: lightblue;">
<h3>Pets:</h3>
<table class="table center" cellpadding="5" cellspacing="5" border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Type</th>
        <th>Food</th>
        <th>Age</th>
        <th>Owner ID</th>
        <!--covers two columns-->
        <th colspan="2" class="options-heading">Options</th>
    </tr>
    {% for pet in pets %}
    <tr>
        <td>{{ pet['id'] }}</td>
        <td>{{ pet['name'] }}</td>
        <td>{{ pet['type'] }}</td>
        <td>{{ foods.get(pet['food_id']) or 'N/A' }}</td>
        <td>{{ pet['age'] }}</td>
        <td>{{ pet['owner_id'] }}</td>
        <td class="text-center" ><a href="/delete/{{pet['id']}}">Delete</a></td>
        <td class="text-center"><a href="/update/{{pet['id']}}">Update</a></td>
    </tr>
    {% endfor %}
</table>
<hr />
<a href="/create">Create New Pet</a>
<hr />
<a href="/owners">Manage Owners</a>
<hr />
<a href="/list_foods">Manage Foods</a>s
</body>
</html>
